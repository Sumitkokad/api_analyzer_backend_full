openapi: 3.0.0

info:
  title: User API
  version: 1.0.0

paths:
  /users:
    get:
      summary: Get users

      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer

        - name: active
          in: query
          required: false
          schema:
            type: boolean

        - name: user_id
          in: query
          required: false
          schema:
            type: integer

      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
                  email:
                    type: string
                required:
                  - id
                  - username
                  - email

    post:
      summary: Create user

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
              required:
                - username

      responses:
        "201":
          description: User created