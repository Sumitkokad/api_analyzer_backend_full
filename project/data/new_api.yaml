openapi: 3.0.0

info:
  title: User API
  version: 2.0.0

paths:
  /users:
    get:
      summary: Get users

      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer

        - name: active
          in: query
          required: false
          schema:
            type: string

        - name: offset
          in: query
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
                required:
                  - id
                  - username

    post:
      summary: Create user

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
              required:
                - username
                - email

      responses:
        "201":
          description: User created

  /products:
    get:
      summary: Get products

      responses:
        "200":
          description: Successful response